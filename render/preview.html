<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>On Behalf Inc — office preview</title>
<style>
  body { margin: 16px; background: #2b2430; color: #f1e6d6; font: 14px sans-serif; }
  canvas { display: block; margin: 6px 0 18px; image-rendering: pixelated; }
  .miso { width: 144px; height: 144px; background: #f6e9d4; }
</style>
</head>
<body>
<!-- Not linked from the game: a fake view to check the pixel art. Serve the
     project folder over http (ES modules do not load from file://). -->
<div>1) Nothing built yet, rest-room under construction</div>
<canvas id="before" width="960" height="576"></canvas>
<div>2) Rest room, training and clinic done (sparkle over one person)</div>
<canvas id="after" width="960" height="576"></canvas>
<div>3) Kim Miso</div>
<canvas id="miso" class="miso" width="144" height="144"></canvas>
<script type="module">
import { MAP } from './map.js';
import { planTargets } from './actors.js';
import { createDrawer } from './draw.js';

const person = (id, role, activity, extra = {}) => ({
  id, role, activity, nation: 'veltora', stress: 20, health: { kind: 'well', daysLeft: 0 }, task: null, ...extra,
});
const people = [
  person('p0', 'agent', 'phone'),
  person('p1', 'agent', 'phone', { stress: 85 }),
  person('p2', 'agent', 'phone'),
  person('p3', 'agent', 'idle'),
  person('p4', 'agent', 'phone'),
  person('p5', 'agent', 'break'),
  person('p6', 'agent', 'break'),
  person('p7', 'agent', 'phone', { health: { kind: 'sick', daysLeft: 2 } }),
  person('p8', 'lead', 'task', { task: { kind: 'coaching' } }),
  person('p9', 'qa', 'task', { task: { kind: 'qa' } }),
];

// Everyone at their target, except two people still walking.
const targets = planTargets(people, MAP);
const actors = people.map((p) => {
  const [x, y] = targets.get(p.id);
  return { id: p.id, x, y, path: [], target: [x, y], gone: false };
});
const walk = (id, x, y, path) => Object.assign(actors.find((a) => a.id === id), { x, y, path });
walk('p6', 12, 8, [[13, 8], [14, 8], [14, 9]]); // heading to the break room
walk('p7', 10, 9, [[10, 10], [10, 11]]); // sick, leaving by the door

const drawer = createDrawer((w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h }));

function scene(id, research, extra) {
  const ctx = document.getElementById(id).getContext('2d');
  drawer.drawOffice(ctx, MAP, research);
  drawer.drawActors(ctx, actors, people, 0);
  ctx.drawImage(drawer.spriteCanvas('miso'), 14 * 48, 6 * 48 - 9, 48, 48);
  drawer.drawBubbles(ctx, actors, people, extra);
}

scene('before', { done: [], build: { researchId: 'rest-room', minutesLeft: 300 } });
scene('after', { done: ['rest-room', 'stress-training', 'clinic'], build: null },
  { sparkles: new Map([['p5', 0]]), timeMs: 400 });

const m = document.getElementById('miso').getContext('2d');
m.imageSmoothingEnabled = false;
m.drawImage(drawer.spriteCanvas('miso'), 0, 0, 144, 144);
</script>
</body>
</html>
